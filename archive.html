<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자료실 · 자료 저장소</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1B2430;
    --ink-soft:#26313F;
    --parchment:#EDE6D6;
    --parchment-dim:#E2D9C6;
    --rust:#B5533C;
    --teal:#3F6C6A;
    --gray:#6B7280;
    --line: rgba(27,36,48,0.13);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 100px;
  }

  .wrap{ max-width: 920px; margin: 0 auto; }

  /* header */
  header{
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 36px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:16px; height:1px; background: var(--teal); }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .count-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gray);
    text-align:right;
  }
  .count-tag b{ color:var(--ink); font-size:20px; display:block; font-family:'Fraunces',serif; font-weight:600;}

  .nav-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--teal);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .nav-link:hover{ border-color: var(--teal); }

  /* upload dropzone */
  .filing-slot{
    position: relative;
    border: 1px dashed rgba(27,36,48,0.28);
    border-radius: 4px;
    padding: 28px;
    margin-bottom: 40px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap: wrap;
    background: rgba(27,36,48,0.02);
    transition: border-color .2s ease, background .2s ease;
  }
  .filing-slot.drag{
    border-color: var(--rust);
    background: rgba(181,83,60,0.06);
  }
  .filing-slot .stamp{
    width:52px; height:52px;
    border:1px solid rgba(27,36,48,0.3);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces',serif;
    font-size: 22px;
    color: var(--rust);
    flex-shrink:0;
  }
  .filing-slot .text{ flex: 1; min-width: 200px; }
  .filing-slot .text .t1{ font-size:15px; font-weight:500; margin-bottom:4px; }
  .filing-slot .text .t2{ font-size:12.5px; color: var(--gray); }
  .btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    background: var(--rust);
    color: var(--parchment);
    border: none;
    padding: 13px 22px;
    border-radius: 3px;
    cursor: pointer;
    text-transform: uppercase;
    transition: background .15s ease, transform .1s ease;
    white-space: nowrap;
  }
  .btn:hover{ background:#c65f47; }
  .btn:active{ transform: scale(0.97); }
  .btn:focus-visible, input:focus-visible, .card:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  #file-input{ display:none; }

  /* filter row */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items:center;
  }
  .search{
    flex:1;
    min-width: 160px;
    background: rgba(27,36,48,0.03);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .search::placeholder{ color: var(--gray); }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--gray);
    cursor: pointer;
    text-transform: uppercase;
  }
  .chip.active{ border-color: var(--teal); color: var(--teal); background: rgba(76,122,120,0.1); }

  /* card grid */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .card{
    background: var(--parchment);
    color: var(--ink);
    border-radius: 3px;
    padding: 20px 18px 16px;
    position: relative;
    box-shadow: 0 6px 18px rgba(27,36,48,0.09);
    display:flex;
    flex-direction:column;
    gap: 10px;
    border-top: 3px solid var(--rust);
  }
  .card::before{
    content:'';
    position:absolute;
    top:14px; right:14px;
    width:8px; height:8px;
    border-radius:50%;
    background: var(--teal);
    opacity:0.5;
  }
  .card .kind{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rust);
  }
  .card .name{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 17px;
    line-height:1.3;
    word-break: break-word;
  }
  .card .meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: #6b6255;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    border-top: 1px dashed rgba(27,36,48,0.2);
    padding-top: 9px;
    margin-top: 2px;
  }
  .card .actions{
    display:flex;
    gap:8px;
    margin-top: 4px;
  }
  .card .actions button{
    flex:1;
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 9px 10px;
    border-radius: 3px;
    border: 1px solid rgba(27,36,48,0.25);
    background: transparent;
    color: var(--ink);
    cursor:pointer;
    text-transform: uppercase;
  }
  .card .actions .dl{ background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .card .actions .del{ color: var(--rust); border-color: rgba(181,83,60,0.4); }
  .card .actions button:hover{ opacity:0.8; }

  .empty{
    grid-column: 1 / -1;
    text-align:center;
    padding: 70px 20px;
    color: var(--gray);
  }
  .empty .big{
    font-family:'Fraunces', serif;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--parchment);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 12px 20px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events:none;
    box-shadow: 0 10px 30px rgba(27,36,48,0.25);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media (max-width: 480px){
    h1{ font-size: 30px; }
    header{ align-items:flex-start; }
    .count-tag{ text-align:left; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Personal Archive</div>
      <h1>자료실</h1>
    </div>
    <div class="count-tag"><b id="count">0</b>건 보관 중</div>
    <a class="nav-link" href="index.html">다운로드 홈페이지 →</a>
  </header>

  <div class="filing-slot" id="dropzone">
    <div class="stamp">＋</div>
    <div class="text">
      <div class="t1">관심 있는 파일을 올려두세요</div>
      <div class="t2">여기로 끌어다 놓거나, 버튼을 눌러 첨부하세요</div>
    </div>
    <button class="btn" id="pick-btn">파일 첨부</button>
    <input type="file" id="file-input" multiple>
  </div>

  <div class="toolbar">
    <input class="search" id="search" type="text" placeholder="파일명으로 검색…">
    <button class="chip active" data-filter="all">전체</button>
    <button class="chip" data-filter="image">이미지</button>
    <button class="chip" data-filter="doc">문서</button>
    <button class="chip" data-filter="other">기타</button>
  </div>

  <div class="grid" id="grid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const grid = document.getElementById('grid');
  const dropzone = document.getElementById('dropzone');
  const fileInput = document.getElementById('file-input');
  const pickBtn = document.getElementById('pick-btn');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const toast = document.getElementById('toast');
  const chips = document.querySelectorAll('.chip');

  let items = [];
  let activeFilter = 'all';
  let searchTerm = '';

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function kindOf(mime, name){
    if(mime && mime.startsWith('image/')) return 'image';
    const ext = (name.split('.').pop() || '').toLowerCase();
    if(['pdf','doc','docx','txt','md','ppt','pptx','xls','xlsx','hwp'].includes(ext)) return 'doc';
    if(mime && mime.startsWith('image/')) return 'image';
    return 'other';
  }

  function kindLabel(kind){
    return kind === 'image' ? '이미지' : kind === 'doc' ? '문서' : '파일';
  }

  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
  }

  async function loadItems(){
    try{
      const res = await window.storage.get('archive:items', false);
      items = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      items = [];
    }
    render();
  }

  async function saveItems(){
    try{
      await window.storage.set('archive:items', JSON.stringify(items), false);
    }catch(e){
      showToast('저장 중 문제가 발생했어요');
    }
  }

  function render(){
    const filtered = items.filter(it=>{
      const matchesFilter = activeFilter === 'all' || it.kind === activeFilter;
      const matchesSearch = !searchTerm || it.name.toLowerCase().includes(searchTerm.toLowerCase());
      return matchesFilter && matchesSearch;
    }).sort((a,b)=> b.addedAt - a.addedAt);

    countEl.textContent = items.length;

    if(filtered.length === 0){
      grid.innerHTML = `<div class="empty">
        <div class="big">${items.length === 0 ? '아직 보관된 자료가 없어요' : '조건에 맞는 자료가 없어요'}</div>
        <div>${items.length === 0 ? '위에서 파일을 첨부해 첫 자료를 채워보세요.' : '검색어나 필터를 바꿔보세요.'}</div>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(it => `
      <div class="card" tabindex="0">
        <div class="kind">${kindLabel(it.kind)}</div>
        <div class="name">${escapeHtml(it.name)}</div>
        <div class="meta">
          <span>${fmtSize(it.size)}</span>
          <span>·</span>
          <span>${fmtDate(it.addedAt)} 보관</span>
        </div>
        <div class="actions">
          <button class="dl" data-id="${it.id}">다운로드</button>
          <button class="del" data-id="${it.id}">삭제</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function readFileAsDataURL(file){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('read failed'));
      reader.readAsDataURL(file);
    });
  }

  async function handleFiles(fileList){
    const files = Array.from(fileList);
    if(files.length === 0) return;

    let addedCount = 0;
    for(const file of files){
      if(file.size > 4.5 * 1024 * 1024){
        showToast(`"${file.name}"은(는) 용량이 너무 커요 (4.5MB 이하만 가능)`);
        continue;
      }
      try{
        const dataUrl = await readFileAsDataURL(file);
        items.push({
          id: Date.now() + '-' + Math.random().toString(36).slice(2,8),
          name: file.name,
          size: file.size,
          mime: file.type,
          kind: kindOf(file.type, file.name),
          addedAt: Date.now(),
          data: dataUrl
        });
        addedCount++;
      }catch(e){
        showToast(`"${file.name}"을(를) 읽는 데 실패했어요`);
      }
    }
    if(addedCount > 0){
      await saveItems();
      render();
      showToast(`${addedCount}개 파일을 보관했어요`);
    }
  }

  pickBtn.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    handleFiles(e.target.files);
    fileInput.value = '';
  });

  ['dragenter','dragover'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault();
      dropzone.classList.add('drag');
    });
  });
  ['dragleave','drop'].forEach(evt=>{
    dropzone.addEventListener(evt, (e)=>{
      e.preventDefault();
      dropzone.classList.remove('drag');
    });
  });
  dropzone.addEventListener('drop', (e)=>{
    if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  });

  grid.addEventListener('click', (e)=>{
    const dlBtn = e.target.closest('.dl');
    const delBtn = e.target.closest('.del');
    if(dlBtn){
      const item = items.find(i => i.id === dlBtn.dataset.id);
      if(item){
        const a = document.createElement('a');
        a.href = item.data;
        a.download = item.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }
    if(delBtn){
      items = items.filter(i => i.id !== delBtn.dataset.id);
      saveItems();
      render();
      showToast('삭제했어요');
    }
  });

  searchEl.addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
  });

  chips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      render();
    });
  });

  loadItems();
})();
</script>
</body>
</html>
