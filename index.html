<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>홈 · 자료 다운로드</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root{
    --ink:#1B2430;
    --ink-soft:#26313F;
    --parchment:#EDE6D6;
    --parchment-dim:#E2D9C6;
    --rust:#B5533C;
    --teal:#3F6C6A;
    --gray:#6B7280;
    --line: rgba(27,36,48,0.13);
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: #FFFFFF;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding: 48px 24px 100px;
  }

  .wrap{ max-width: 920px; margin: 0 auto; }

  /* header */
  header{
    display:flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 20px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 28px;
    margin-bottom: 36px;
  }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--teal);
    margin-bottom: 10px;
    display:flex; align-items:center; gap:8px;
  }
  .eyebrow::before{ content:''; width:16px; height:1px; background: var(--teal); }
  h1{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 40px;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .count-tag{
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--gray);
    text-align:right;
  }
  .count-tag b{ color:var(--ink); font-size:20px; display:block; font-family:'Fraunces',serif; font-weight:600;}

  .nav-link{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--teal);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 8px 14px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .nav-link:hover{ border-color: var(--teal); }
  .nav-link:focus-visible, .card:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

  /* filter row */
  .toolbar{
    display:flex;
    gap:10px;
    margin-bottom: 24px;
    flex-wrap: wrap;
    align-items:center;
  }
  .search{
    flex:1;
    min-width: 160px;
    background: rgba(27,36,48,0.03);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 10px 14px;
    border-radius: 3px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .search::placeholder{ color: var(--gray); }
  .chip{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 8px 13px;
    border-radius: 3px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--gray);
    cursor: pointer;
    text-transform: uppercase;
  }
  .chip.active{ border-color: var(--teal); color: var(--teal); background: rgba(76,122,120,0.1); }

  /* file list */
  .grid{
    display:flex;
    flex-direction:column;
    border-top: 1px solid var(--line);
  }

  .card{
    background: transparent;
    color: var(--ink);
    padding: 16px 4px;
    position: relative;
    display:flex;
    align-items:center;
    gap: 16px;
    border-bottom: 1px solid var(--line);
  }
  .card::before{
    content:'';
    width:8px; height:8px;
    border-radius:50%;
    background: var(--teal);
    opacity:0.5;
    flex-shrink:0;
  }
  .card .kind{
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--rust);
    width: 52px;
    flex-shrink:0;
  }
  .card .main{
    flex:1;
    min-width:0;
    display:flex;
    flex-direction:column;
    gap: 3px;
  }
  .card .name{
    font-family:'Fraunces', serif;
    font-weight: 600;
    font-size: 16px;
    line-height:1.3;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
  }
  .card .meta{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--gray);
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .card .actions{
    display:flex;
    gap:8px;
    flex-shrink:0;
  }
  .card .actions button{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    padding: 9px 14px;
    border-radius: 3px;
    border: 1px solid rgba(27,36,48,0.25);
    background: transparent;
    color: var(--ink);
    cursor:pointer;
    text-transform: uppercase;
    white-space:nowrap;
  }
  .card .actions .dl{ background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .card .actions .del{ color: var(--rust); border-color: rgba(181,83,60,0.4); }
  .card .actions button:hover{ opacity:0.8; }

  .empty{
    text-align:center;
    padding: 70px 20px;
    color: var(--gray);
  }
  .empty .big{
    font-family:'Fraunces', serif;
    font-size: 22px;
    color: var(--ink);
    margin-bottom: 8px;
  }

  .toast{
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--parchment);
    font-family:'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 12px 20px;
    border-radius: 4px;
    opacity: 0;
    transition: opacity .25s ease, transform .25s ease;
    pointer-events:none;
    box-shadow: 0 10px 30px rgba(27,36,48,0.25);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }

  @media (max-width: 480px){
    h1{ font-size: 30px; }
    header{ align-items:flex-start; }
    .count-tag{ text-align:left; }
    .card{ flex-wrap: wrap; }
    .card .kind{ width:auto; }
    .card .actions{ width:100%; margin-top: 6px; }
    .card .actions button{ flex:1; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <div class="eyebrow">Personal Archive</div>
      <h1>홈</h1>
    </div>
    <div class="count-tag"><b id="count">0</b>건 보관 중</div>
    <a class="nav-link" href="archive.html">자료실 관리 →</a>
  </header>

  <div class="toolbar">
    <input class="search" id="search" type="text" placeholder="파일명으로 검색…">
    <button class="chip active" data-filter="all">전체</button>
    <button class="chip" data-filter="image">이미지</button>
    <button class="chip" data-filter="doc">문서</button>
    <button class="chip" data-filter="other">기타</button>
  </div>

  <div class="grid" id="grid"></div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  const searchEl = document.getElementById('search');
  const toast = document.getElementById('toast');
  const chips = document.querySelectorAll('.chip');

  let items = [];
  let activeFilter = 'all';
  let searchTerm = '';

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(()=> toast.classList.remove('show'), 2200);
  }

  function kindOf(mime, name){
    if(mime && mime.startsWith('image/')) return 'image';
    const ext = (name.split('.').pop() || '').toLowerCase();
    if(['pdf','doc','docx','txt','md','ppt','pptx','xls','xlsx','hwp'].includes(ext)) return 'doc';
    if(mime && mime.startsWith('image/')) return 'image';
    return 'other';
  }

  function kindLabel(kind){
    return kind === 'image' ? '이미지' : kind === 'doc' ? '문서' : '파일';
  }

  function fmtSize(bytes){
    if(bytes < 1024) return bytes + ' B';
    if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
    return (bytes/1024/1024).toFixed(1) + ' MB';
  }

  function fmtDate(ts){
    const d = new Date(ts);
    return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');
  }

  async function loadItems(){
    try{
      const res = await window.storage.get('archive:items', false);
      items = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      items = [];
    }
    render();
  }

  async function saveItems(){
    try{
      await window.storage.set('archive:items', JSON.stringify(items), false);
    }catch(e){
      showToast('저장 중 문제가 발생했어요');
    }
  }

  function render(){
    const filtered = items.filter(it=>{
      const matchesFilter = activeFilter === 'all' || it.kind === activeFilter;
      const matchesSearch = !searchTerm || it.name.toLowerCase().includes(searchTerm.toLowerCase());
      return matchesFilter && matchesSearch;
    }).sort((a,b)=> b.addedAt - a.addedAt);

    countEl.textContent = items.length;

    if(filtered.length === 0){
      grid.innerHTML = `<div class="empty">
        <div class="big">${items.length === 0 ? '아직 보관된 자료가 없어요' : '조건에 맞는 자료가 없어요'}</div>
        <div>${items.length === 0 ? '자료실 페이지에서 파일을 올리면 여기에 표시돼요.' : '검색어나 필터를 바꿔보세요.'}</div>
      </div>`;
      return;
    }

    grid.innerHTML = filtered.map(it => `
      <div class="card" tabindex="0">
        <div class="kind">${kindLabel(it.kind)}</div>
        <div class="main">
          <div class="name">${escapeHtml(it.name)}</div>
          <div class="meta">
            <span>${fmtSize(it.size)}</span>
            <span>·</span>
            <span>${fmtDate(it.addedAt)} 보관</span>
          </div>
        </div>
        <div class="actions">
          <button class="dl" data-id="${it.id}">다운로드</button>
        </div>
      </div>
    `).join('');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  grid.addEventListener('click', (e)=>{
    const dlBtn = e.target.closest('.dl');
    if(dlBtn){
      const item = items.find(i => i.id === dlBtn.dataset.id);
      if(item){
        const a = document.createElement('a');
        a.href = item.data;
        a.download = item.name;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }
    }
  });

  searchEl.addEventListener('input', (e)=>{
    searchTerm = e.target.value;
    render();
  });

  chips.forEach(chip=>{
    chip.addEventListener('click', ()=>{
      chips.forEach(c=>c.classList.remove('active'));
      chip.classList.add('active');
      activeFilter = chip.dataset.filter;
      render();
    });
  });

  loadItems();

  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState === 'visible') loadItems();
  });
  window.addEventListener('pageshow', (e)=>{
    if(e.persisted) loadItems();
  });
  window.addEventListener('focus', loadItems);
})();
</script>
</body>
</html>
